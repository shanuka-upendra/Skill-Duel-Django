<!DOCTYPE html>
<html>

<head>
    <title>Login — Skill Duel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <div class="container mt-5" style="max-width:400px">
        <h2 class="text-center mb-1">⚔️ Skill Duel</h2>
        <p class="text-center text-secondary mb-4">Login to challenge someone</p>

        <div class="card bg-secondary border-0 p-4">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100 mt-2 fw-bold">Login</button>
            </form>
            <p class="text-center mt-3 mb-0 small">
                No account? <a href="/register" class="text-warning">Register here</a>
            </p>
        </div>
    </div>
</body>

</html>
